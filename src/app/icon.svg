<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    ไอคอนบนแท็บเบราว์เซอร์ — ตัว T บนพื้นไล่สีเดียวกับโลโก้ในแอป
    เดิมไม่มีไฟล์นี้ เบราว์เซอร์จึงขอ /favicon.ico แล้วได้ 404 ทุกหน้า
    (ไม่ทำให้อะไรพัง แต่ขึ้นสีแดงใน console ตลอด จนบังข้อผิดพลาดจริงที่ควรเห็น)
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C7CF0" />
      <stop offset="1" stop-color="#5B5BD6" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)" />
  <text
    x="16"
    y="22"
    text-anchor="middle"
    font-family="IBM Plex Sans, Segoe UI, sans-serif"
    font-size="19"
    font-weight="700"
    fill="#fff"
  >T</text>
</svg>
