server {
    listen 80;
    server_name taronex.theerawut.com;
    client_max_body_size 1024m;

    root /var/www/taronex-home;
    index index.html;

    # กันรหัสที่ทำงานรั่วออกไปเว็บอื่นผ่าน Referer
    add_header Referrer-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;

    # /app/internal — หน้าภายใน ปิดด้วยรหัสผ่าน 25 ส.ค. 2569
    #
    # ปิดที่ nginx ไม่ใช่ในแอป เพราะสองเหตุผล
    #   1. แอปพังเมื่อไหร่ หน้านี้ก็ยังปิดอยู่ · ถ้าปิดในแอป แอปพัง = ประตูเปิด
    #   2. คำขอที่ไม่มีรหัสผ่านถูกตัดตั้งแต่ nginx ไม่ต้องวิ่งเข้า Node เลย
    #
    # ⚠ basic auth ส่งรหัสแบบเข้ารหัส base64 ไม่ใช่การเข้ารหัสจริง
    #   ปลอดภัยได้เพราะช่วง เบราว์เซอร์→Cloudflare เป็น HTTPS
    #   แต่ช่วง Cloudflare→เครื่องนี้ยังเป็น HTTP ธรรมดา
    #   ปิดช่องนั้นได้ด้วยการตั้ง Cloudflare SSL เป็น Full (strict)
    #   แล้วลง Origin Certificate ที่เครื่องนี้ — ยังไม่ได้ทำ
    location /app/internal {
        auth_basic "TaroNex internal";
        auth_basic_user_file /etc/nginx/.htpasswd-internal;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # /app — ระบบจริง (Next.js, basePath=/app)
    location /app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # /prototype — ต้นแบบ 52 หน้าจอจากสเปค
    location = /prototype { return 301 /prototype/; }
    location /prototype/ {
        alias /var/www/taronex-app/;
        index index.html;
        autoindex on;
    }

    # /readme — ปิดไว้ 20 ส.ค. 2569 (ไฟล์ยังอยู่ที่ /opt/taronex/readme ไม่ได้ลบ)
    # เหตุผล: อยู่ origin เดียวกับระบบจริง มี upload + รหัสผ่านเดียว (ดู PROGRESS.md)
    # เปิดคืน: คืนบล็อกเดิมจาก /etc/nginx/sites-available/taronex.bak-* แล้ว
    #          systemctl start taronex-uploader
    location = /readme { return 404; }
    location /readme/ { return 404; }

    location / { try_files $uri $uri/ =404; }
}
