name: ตรวจก่อนรวมโค้ด

# CLAUDE.md กำหนดว่าทุก PR ต้องผ่าน biome check · ไม่มี any · มีเทสต์
# ให้เครื่องตรวจแทนคน เพราะคนลืม
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ชนิดข้อมูล (strict · ห้ามมี any)
        run: pnpm exec tsc --noEmit

      - name: รูปแบบและ lint
        run: pnpm exec biome check .

      # เปิดใช้เมื่อ M0 ลง Vitest แล้ว
      # - name: เทสต์หน่วย
      #   run: pnpm test

      # เทสต์ที่พิสูจน์ว่าเข้าข้อมูลข้ามที่ทำงานไม่ได้ (ต้องได้ 404 ไม่ใช่ 403)
      # เปิดใช้เมื่อ M1 มีฐานข้อมูลแล้ว
      # - name: เทสต์ข้ามที่ทำงาน
      #   run: pnpm test:e2e
