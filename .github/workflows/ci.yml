name: ตรวจก่อนรวมโค้ด

# CLAUDE.md กำหนดว่าทุก PR ต้องผ่าน biome check · ไม่มี any · มีเทสต์
# ให้เครื่องตรวจแทนคน เพราะคนลืม
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # เทสต์การแยกข้อมูลข้ามที่ทำงานต้องยิงฐานข้อมูลจริง
    # ถ้า CI ไม่มี Postgres เทสต์ที่สำคัญที่สุดในระบบจะไม่เคยได้รัน
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taronex
          POSTGRES_PASSWORD: devonly
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DATABASE_MIGRATION_URL: postgres://postgres:devonly@127.0.0.1:5432/taronex
      DATABASE_URL: postgres://app:devonly@127.0.0.1:5432/taronex

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ชนิดข้อมูล (strict · ห้ามมี any)
        run: pnpm exec tsc --noEmit

      - name: รูปแบบและ lint
        run: pnpm exec biome check .

      - name: สร้างสคีมา
        run: pnpm exec drizzle-kit migrate

      - name: RLS · trigger · สิทธิ์ของ role app
        run: pnpm db:rls

      # ⚠ เทสต์สั่ง TRUNCATE ทุกตาราง จึงต้องแยกฐานคนละใบกับฐานที่แอปใช้
      # `pnpm test` เรียก db:test:setup ให้เอง แล้วต่อไปที่ taronex_test
      # ตัวกันใน src/test/db.ts ปฏิเสธทุกชื่อฐานที่ไม่ลงท้ายด้วย _test
      - name: เทสต์หน่วย + การแยกข้อมูลข้ามที่ทำงาน
        run: pnpm test

      - name: ลงเบราว์เซอร์สำหรับเทสต์
        run: pnpm exec playwright install --with-deps chromium

      - name: สร้างและเปิดแอป
        run: |
          pnpm build
          pnpm start &
          npx wait-on http://127.0.0.1:3000/app/api/v1/meta/health -t 60000

      # เทสต์นี้จับสิ่งที่ curl จับไม่ได้ — หน้าจอเป็น client component
      # ยิง curl เห็นแต่โครงว่าง ต้องมีเบราว์เซอร์จริงถึงจะรู้ว่าคนใช้เห็นอะไร
      - name: เทสต์ผ่านเบราว์เซอร์
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000 # ไม่ใช่ 127.0.0.1 — ดูเหตุผลใน playwright.config.ts
          # ค่าเริ่มต้นคือ /var/lib/taronex/avatars ซึ่ง runner ไม่มีและเขียนไม่ได้
          # ไม่ตั้งค่านี้ = เทสต์อัปรูปโปรไฟล์ตกทุกครั้งบน CI
          AVATAR_DIR: ${{ runner.temp }}/avatars
