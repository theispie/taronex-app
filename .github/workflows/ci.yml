name: ตรวจก่อนรวมโค้ด

# CLAUDE.md กำหนดว่าทุก PR ต้องผ่าน biome check · ไม่มี any · มีเทสต์
# ให้เครื่องตรวจแทนคน เพราะคนลืม
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # เทสต์การแยกข้อมูลข้ามที่ทำงานต้องยิงฐานข้อมูลจริง
    # ถ้า CI ไม่มี Postgres เทสต์ที่สำคัญที่สุดในระบบจะไม่เคยได้รัน
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taronex
          POSTGRES_PASSWORD: devonly
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DATABASE_MIGRATION_URL: postgres://postgres:devonly@127.0.0.1:5432/taronex
      DATABASE_URL: postgres://app:devonly@127.0.0.1:5432/taronex

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ชนิดข้อมูล (strict · ห้ามมี any)
        run: pnpm exec tsc --noEmit

      - name: รูปแบบและ lint
        run: pnpm exec biome check .

      - name: สร้างสคีมา
        run: pnpm exec drizzle-kit migrate

      - name: RLS · trigger · สิทธิ์ของ role app
        run: pnpm db:rls

      - name: เทสต์หน่วย + การแยกข้อมูลข้ามที่ทำงาน
        run: pnpm test

      # เปิดใช้เมื่อมี endpoint จริงให้ยิง (M2)
      # - name: เทสต์ผ่านเบราว์เซอร์
      #   run: pnpm test:e2e
